services:
  - type: web
    name: tradingview-upstox-bridge
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPSTOX_API_BASE_URL
        value: https://api-sandbox.upstox.com/v2
      - key: DEFAULT_PRODUCT
        value: I
      - key: DEFAULT_ORDER_TYPE
        value: MARKET
      - key: TRADING_ENABLED
        value: "true"
      - key: DUPLICATE_WINDOW_SECONDS
        value: "30"
      - key: UPSTOX_MAX_RETRIES
        value: "2"
      - key: UPSTOX_RETRY_BASE_DELAY_MS
        value: "500"
      - key: STRIKE_INTERVAL
        value: "100"
      - key: INSTRUMENT_MASTER_CACHE_TTL_MS
        value: "21600000"

      # Makes log timestamps render in IST. Nothing in the code depends on it —
      # all session logic passes timeZone: 'Asia/Kolkata' explicitly — but it
      # makes reading production logs against an NSE session far easier.
      - key: TZ
        value: Asia/Kolkata

      # Intraday session rules (IST). Every one of these has the same default
      # in config/env.js, so the service runs correctly without them; they are
      # listed here so they can be adjusted from the Render dashboard without
      # a code change.
      - key: ENTRY_CUTOFF_IST
        value: "14:45"
      - key: SQUARE_OFF_IST
        value: "15:20"
      - key: SQUARE_OFF_ENABLED
        value: "true"
      - key: SQUARE_OFF_POLL_SECONDS
        value: "60"

      # Bid-ask charged against both legs of a paper trade. The Upstox sandbox
      # never fills orders, so P&L is marked to the option's real traded price
      # and this is the only cost model there is. Do not set to 0 unless you
      # deliberately want gross, pre-cost numbers.
      - key: PAPER_SLIPPAGE_POINTS
        value: "1.5"
      # Secrets — Render will prompt for these during Blueprint setup rather
      # than storing a value here (sync: false = "no value in this file").
      - key: WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: UPSTOX_SANDBOX_ACCESS_TOKEN
        sync: false
      # Without this the /api/* admin dashboard routes stay disabled.
      - key: ADMIN_PASSWORD
        sync: false
